services:
  # FastAPI 应用
  app:
    build: .
    container_name: news-info-app
    restart: unless-stopped
    env_file:
      - .env
    # 这里显式固定容器间的网络地址，覆盖 .env 里的同名值——
    # 保证即使误用了本地开发版 .env（DB_HOST=localhost）也能正确连到 mysql/redis 容器。
    # 密码等敏感信息仍从 .env 注入。
    environment:
      - API_PORT=8000
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    volumes:
      - ./static/uploads:/app/static/uploads
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # MySQL 8 数据库
  mysql:
    image: m.daocloud.io/docker.io/mysql:8
    container_name: news-info-mysql
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME}
    ports:
      - "3307:3306"   # 宿主机 3307 -> 容器 3306，避开本机已装的 MySQL
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis 缓存
  redis:
    image: m.daocloud.io/docker.io/redis:7-alpine
    container_name: news-info-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - "6380:6379"   # 宿主机 6380 -> 容器 6379，避开本机已装的 Redis
    volumes:
      - redis-data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge
